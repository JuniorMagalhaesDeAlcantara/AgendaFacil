<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
 
    <title>Agenda Fácil</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
 
    <style>
        body {
            background-color: #f4f6fa;
            font-family: Arial, sans-serif;
        }
 
        .navbar {
            background: linear-gradient(135deg, #3157c8, #587ce8);
        }
 
        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
        }
 
        .titulo {
            color: #26345b;
            font-weight: 700;
        }
 
        .btn-primary {
            background-color: #3157c8;
            border: none;
        }
 
        .form-control {
            padding: 11px;
        }
    </style>
</head>
 
<body>
 
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
 
            <span class="navbar-brand fw-bold">
                📒 Agenda Fácil
            </span>
 
            <a href="/contatos" class="btn btn-sm btn-light">
                Voltar
            </a>
 
        </div>
    </nav>
 
    <main class="container pb-5">
 
        <div class="row justify-content-center">
 
            <div class="col-lg-6 col-md-8">
 
                <div class="mb-4">
                    <h2 class="titulo" th:text="${titulo}">
                        Novo contato
                    </h2>
 
                    <p class="text-secondary">
                        Preencha as informações do contato.
                    </p>
                </div>
 
                <div class="card">
 
                    <div class="card-body p-4">
 
                        <!-- Formulário que envia os dados pelo método POST. -->
                        <form th:action="@{/contatos/salvar}"
                              th:object="${contato}"
                              method="post">
 
                            <!-- Guarda o ID durante a edição. -->
                            <input type="hidden" th:field="*{id}">
 
                            <div class="mb-3">
 
                                <label class="form-label fw-semibold">
                                    Nome completo
                                </label>
 
                                <input type="text"
                                       th:field="*{nome}"
                                       class="form-control"
                                       placeholder="Digite o nome"
                                       maxlength="100"
                                       required>
 
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('nome')}"
                                     th:errors="*{nome}">
                                </div>
 
                            </div>
 
                            <div class="mb-3">
 
                                <label class="form-label fw-semibold">
                                    Telefone
                                </label>
 
                                <input type="text"
                                       th:field="*{telefone}"
                                       class="form-control"
                                       placeholder="(11) 99999-9999"
                                       maxlength="20"
                                       required>
 
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('telefone')}"
                                     th:errors="*{telefone}">
                                </div>
 
                            </div>
 
                            <div class="mb-4">
 
                                <label class="form-label fw-semibold">
                                    E-mail
                                </label>
 
                                <input type="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       placeholder="email@exemplo.com"
                                       maxlength="100"
                                       required>
 
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">
                                </div>
 
                            </div>
 
                            <div class="d-flex gap-2">
 
                                <button type="submit"
                                        class="btn btn-primary px-4">
                                    Salvar contato
                                </button>
 
                                <a href="/contatos"
                                   class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
 
                            </div>
 
                        </form>
 
                    </div>
 
                </div>
 
            </div>
 
        </div>
 
    </main>
 
</body>
</html>
